<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Dashboard Launcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .launcher {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .logo { font-size: 4em; margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; line-height: 1.6; }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            display: block;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 1em;
        }
        .btn:hover { transform: translateY(-2px); }
        .primary { grid-column: 1 / -1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin: 10px 0;
        }
        .status {
            background: #f0f8ff;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="launcher">
        <div class="logo">🎥</div>
        <h1>YT Dashboard Launcher</h1>
        <p>Create clones with AI-powered reference videos and intelligent script generation</p>
        
        <div class="status">
            <strong>✅ System Status: Ready</strong><br>
            <small>👤 Created by Pires for AI video production</small>
        </div>

        <div class="actions">
            <a class="btn primary" onclick="location.reload()">🚀 Launch Dashboard</a>
            <button class="btn" onclick="document.getElementBy01('urlInput').focus()">📹 Add Reference Video</button>
            <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=..." onkeydown="if(event.key === 'Enter') addReference()">
            <button class="btn primary" onclick="addReference()">➕ Add Reference</button>
        </div>
    </div>

    <script>
        function addReference() {
            const url = document.getElementById('urlInput').value;
            if (url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                window.location.href = `launch-dashboard.bat "${url}"`;
            } else if (url) {
                alert('⚠️ Please enter a valid YouTube URL');
            }
        }
    </script>
</body>
</html>
